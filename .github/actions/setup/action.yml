name: Set up Concord
description: Node 22, pnpm with a cached store, the workspace's dependencies and, optionally, a cached Chromium for Playwright.

inputs:
  playwright:
    description: Also install Chromium for Playwright ('true' or 'false').
    default: 'false'
  apt:
    description: Extra apt packages to install (space separated), such as ffmpeg.
    default: ''

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash

    # The browser download is ~150 MB and was the slowest step of every e2e job, so it is
    # cached per Playwright version. The system libraries it needs still come from apt.
    - id: pw
      if: inputs.playwright == 'true'
      shell: bash
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
    - id: pw-cache
      if: inputs.playwright == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
    - if: inputs.playwright == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm exec playwright install chromium
    - if: inputs.playwright == 'true'
      shell: bash
      run: pnpm exec playwright install-deps chromium

    - if: inputs.apt != ''
      shell: bash
      run: |
        [ "${{ inputs.playwright }}" = "true" ] || sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends ${{ inputs.apt }}
