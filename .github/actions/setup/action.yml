name: Set up Concord
description: Node 22, pnpm with a cached store, the workspace's dependencies and, optionally, a cached Chromium for Playwright.

inputs:
  playwright:
    description: Also install Chromium for Playwright ('true' or 'false').
    default: 'false'
  apt:
    description: Extra apt packages to install (space separated), such as ffmpeg.
    default: ''

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash

    # The browser download is ~150 MB and was the slowest step of every e2e job, so it is
    # cached per Playwright version. The system libraries it needs still come from apt.
    - id: pw
      if: inputs.playwright == 'true'
      shell: bash
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
    - id: pw-cache
      if: inputs.playwright == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
    - if: inputs.playwright == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm exec playwright install chromium
    - if: inputs.playwright == 'true'
      shell: bash
      run: pnpm exec playwright install-deps chromium

    # Extra apt packages. The downloaded .deb files are cached per package list (and restored
    # from any earlier list as a fallback), because the runners' Ubuntu mirror is sometimes so
    # slow that downloading ffmpeg alone took over half an hour and timed jobs out. With the
    # files cached, apt installs without downloading them again. The cache is saved straight
    # after the install, so a job that fails later still leaves it for the next one.
    - id: apt-key
      if: inputs.apt != ''
      shell: bash
      run: |
        echo "dir=$HOME/.cache/apt-archives" >> "$GITHUB_OUTPUT"
        echo "prefix=apt-${{ runner.os }}-$(lsb_release -rs)-" >> "$GITHUB_OUTPUT"
        echo "packages=$(echo '${{ inputs.apt }}' | tr -s ' ' '\n' | sort | tr '\n' ' ' | sed 's/ $//; s/ /+/g')" >> "$GITHUB_OUTPUT"
    - id: apt-cache
      if: inputs.apt != ''
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.apt-key.outputs.dir }}
        key: ${{ steps.apt-key.outputs.prefix }}${{ steps.apt-key.outputs.packages }}
        restore-keys: ${{ steps.apt-key.outputs.prefix }}
    - if: inputs.apt != ''
      shell: bash
      run: |
        dir='${{ steps.apt-key.outputs.dir }}'
        mkdir -p "$dir/partial"
        # Keep what is downloaded, retry stalled downloads, and give up on a dead connection
        # rather than hang until the job's timeout.
        opts=(-o "Dir::Cache::Archives=$dir" -o APT::Keep-Downloaded-Packages=true -o Acquire::Retries=5 -o Acquire::http::Timeout=60)
        install() { sudo apt-get install -y --no-install-recommends "${opts[@]}" ${{ inputs.apt }}; }
        # With every file cached, the image's package lists may already be enough.
        if [ "${{ inputs.playwright }}" = "true" ] || ! install; then
          [ "${{ inputs.playwright }}" = "true" ] || sudo apt-get update -qq -o Acquire::Retries=5 -o Acquire::http::Timeout=60
          install
        fi
        sudo rm -rf "$dir/partial" "$dir/lock"
        sudo chown -R "$(id -u):$(id -g)" "$dir"
    - if: inputs.apt != '' && steps.apt-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.apt-key.outputs.dir }}
        key: ${{ steps.apt-key.outputs.prefix }}${{ steps.apt-key.outputs.packages }}
