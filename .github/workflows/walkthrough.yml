name: Walkthrough video

# Records the two narrated videos (walkthrough/README.md) for every published release, or
# on demand, and attaches them to the release: the tour (concord-walkthrough.*) and how
# alpha testers take part (concord-feedback.*). The /welcome page plays the copies from
# the newest release that has them. A third video, a closer look at the features
# (concord-features.*), is recorded only when asked for with the `video` input; it lands in
# the run's artifact rather than on a release.
#
# Release videos use `--publish`: every scene must run cleanly, with no stand-ins, no
# warnings and no requests to outside hosts, or nothing is attached. Set the
# ELEVENLABS_API_KEY repository secret (or OPENAI_API_KEY / GOOGLE_TTS_API_KEY) for the
# narration; without one, release runs are skipped with a notice.
#
# Voice characters are limited (and ElevenLabs flags bursts of use), so narration is
# cached per paragraph and kept with each release: a release re-voices only the paragraphs
# whose words changed. A run may send at most VOICE_CHAR_BUDGET new characters (repository
# variable, default 2500; both scripts in full are about 8,000) and refuses before
# sending anything if it would need more. For a first or full recording, run this
# workflow by hand with a larger budget (0 for no limit) and the release tag to attach to.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      voice:
        description: Voice provider. Empty picks from the secrets that are set.
        type: choice
        options: ['', elevenlabs, openai, google, silent]
        default: ''
      mode:
        description: publish (strict, as for a release) or draft (stand-ins allowed, labelled)
        type: choice
        options: [publish, draft]
        default: publish
      voice_budget:
        description: Most new narration characters to send (empty uses VOICE_CHAR_BUDGET or 2500; 0 means no limit)
        type: string
        default: ''
      video:
        description: Which videos to record. Only tour,feedback (the pair /welcome plays) can be attached to a release.
        type: choice
        options: ['tour,feedback', tour, feedback, features]
        default: 'tour,feedback'
      release:
        description: Release tag to attach the videos to, such as v0.17.0 (publish mode only; created from this commit if it doesn't exist; empty attaches nothing)
        type: string
        default: ''

# Nothing here writes to the repository except the attach job, which asks for it itself.
permissions:
  contents: read

concurrency:
  group: walkthrough-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    # Pinned so a release re-recorded later renders with the same system and fonts.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      recorded: ${{ steps.record.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Inputs are only ever read from the environment, never pasted into the script.
      - name: Choose the voice
        id: voice
        env:
          VOICE: ${{ inputs.voice }}
          MODE: ${{ inputs.mode || 'publish' }}
          HAS_ELEVENLABS: ${{ secrets.ELEVENLABS_API_KEY != '' }}
          HAS_OPENAI: ${{ secrets.OPENAI_API_KEY != '' }}
          HAS_GOOGLE: ${{ secrets.GOOGLE_TTS_API_KEY != '' }}
        run: |
          case "$VOICE" in
            ''|elevenlabs|openai|google|silent) ;;
            *) echo "::error::Unknown voice '$VOICE'"; exit 1 ;;
          esac
          case "$MODE" in
            publish|draft) ;;
            *) echo "::error::Unknown mode '$MODE'"; exit 1 ;;
          esac
          if [ -z "$VOICE" ]; then
            if [ "$HAS_ELEVENLABS" = true ]; then VOICE=elevenlabs
            elif [ "$HAS_OPENAI" = true ]; then VOICE=openai
            elif [ "$HAS_GOOGLE" = true ]; then VOICE=google
            else VOICE=silent; fi
          fi
          ready=true
          if [ "$MODE" = publish ] && [ "$VOICE" = silent ]; then
            echo "::notice::No narration voice is configured (set ELEVENLABS_API_KEY), so no release video was recorded."
            ready=false
          fi
          {
            echo "voice=$VOICE"
            echo "mode=$MODE"
            echo "ready=$ready"
          } >> "$GITHUB_OUTPUT"

      - if: steps.voice.outputs.ready == 'true'
        uses: ./.github/actions/setup
        with:
          playwright: 'true'
          apt: ffmpeg fonts-inter fonts-jetbrains-mono
      # Approved narration is kept with each release, so the next release re-voices only
      # the paragraphs whose words changed, even after the Actions cache has expired.
      # Paid narration is saved even when the recording fails afterwards (a later run then
      # re-voices nothing), so each run saves under its own key and restores the newest.
      - uses: actions/cache/restore@v4
        if: steps.voice.outputs.ready == 'true'
        with:
          path: walkthrough/.cache/voice
          key: walkthrough-voice-${{ steps.voice.outputs.voice }}-${{ hashFiles('walkthrough/narration.md', 'walkthrough/feedback.md', 'walkthrough/features.md', 'walkthrough/lexicon.json', 'walkthrough/lib/tts.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            walkthrough-voice-${{ steps.voice.outputs.voice }}-${{ hashFiles('walkthrough/narration.md', 'walkthrough/feedback.md', 'walkthrough/features.md', 'walkthrough/lexicon.json', 'walkthrough/lib/tts.ts') }}-
            walkthrough-voice-${{ steps.voice.outputs.voice }}-
      - name: Restore narration from the last release
        if: steps.voice.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # The newest release that kept its narration (a re-run for a release reuses its own).
          mkdir -p walkthrough/.cache/voice
          for t in $(gh release list --repo "$REPO" --limit 10 --json tagName --jq '.[].tagName'); do
            if gh release download "$t" --repo "$REPO" --pattern walkthrough-voice.tar.gz --dir "$RUNNER_TEMP" --clobber 2>/dev/null; then
              tar -xzf "$RUNNER_TEMP/walkthrough-voice.tar.gz" -C walkthrough/.cache/voice
              echo "Restored narration from $t"
              break
            fi
          done

      - name: Record
        id: record
        if: steps.voice.outputs.ready == 'true'
        env:
          VOICE: ${{ steps.voice.outputs.voice }}
          MODE: ${{ steps.voice.outputs.mode }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # mp3_44100_128 (the default) works on every ElevenLabs plan; 192 kbps needs Creator.
          ELEVENLABS_OUTPUT_FORMAT: ${{ vars.ELEVENLABS_OUTPUT_FORMAT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          VOICE_CHAR_BUDGET: ${{ inputs.voice_budget || vars.VOICE_CHAR_BUDGET || '2500' }}
          VIDEO: ${{ inputs.video || 'tour,feedback' }}
        run: |
          case "$VIDEO" in
            tour,feedback|tour|feedback|features) ;;
            *) echo "::error::Unknown video '$VIDEO'"; exit 1 ;;
          esac
          if [ "$MODE" = publish ]; then
            pnpm walkthrough --publish --voice "$VOICE" --video "$VIDEO"
          else
            pnpm walkthrough --voice "$VOICE" --video "$VIDEO"
          fi
      - name: Keep the narration, even if the recording failed
        if: always() && steps.voice.outputs.ready == 'true'
        run: |
          mkdir -p walkthrough/.cache/voice walkthrough/out
          tar -czf walkthrough/out/walkthrough-voice.tar.gz -C walkthrough/.cache/voice .
      - uses: actions/cache/save@v4
        if: always() && steps.voice.outputs.ready == 'true'
        with:
          path: walkthrough/.cache/voice
          key: walkthrough-voice-${{ steps.voice.outputs.voice }}-${{ hashFiles('walkthrough/narration.md', 'walkthrough/feedback.md', 'walkthrough/features.md', 'walkthrough/lexicon.json', 'walkthrough/lib/tts.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-artifact@v4
        if: always() && steps.voice.outputs.ready == 'true'
        with:
          name: concord-walkthrough
          path: |
            walkthrough/out/concord-*.mp4
            walkthrough/out/concord-*.vtt
            walkthrough/out/concord-*.transcript.md
            walkthrough/out/concord-*.chapters.txt
            walkthrough/out/concord-*.report.json
            walkthrough/out/walkthrough-voice.tar.gz
          if-no-files-found: ignore
          retention-days: 90

  # Only a clean --publish run reaches here; this is the one job that can write.
  attach:
    needs: record
    # A release gets the pair the welcome page plays, so only a run that recorded both is attached.
    if: needs.record.outputs.recorded == 'true' && (github.event_name == 'release' || (inputs.release != '' && inputs.mode == 'publish' && inputs.video == 'tour,feedback'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: walkthrough/attach-release.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: concord-walkthrough
          path: out
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.release }}
          SHA: ${{ github.sha }}
        run: bash walkthrough/attach-release.sh
