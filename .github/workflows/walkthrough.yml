name: Walkthrough video

# Records the narrated walkthrough (walkthrough/README.md) for every published release,
# or on demand, and attaches it to the release. Set the ELEVENLABS_API_KEY repository
# secret for the narrated version; without it the video is a captioned draft.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      voice:
        description: Voice provider (elevenlabs, openai, google or silent). Empty picks from the secrets that are set.
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: walkthrough-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
          apt: ffmpeg fonts-inter fonts-jetbrains-mono
      # HermiT, so the reasoner shows as passing in the video.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # owlready2 (and LinkML for the tests) took most of a minute to install each run.
      - uses: actions/cache@v4
        with:
          path: toolkit/.venv
          key: toolkit-venv-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('toolkit/requirements.txt', 'toolkit/setup.sh') }}
      - run: ./toolkit/setup.sh
      # Voices are cached by their exact words, so unchanged paragraphs are never re-voiced.
      - uses: actions/cache@v4
        with:
          path: walkthrough/.cache/voice
          key: walkthrough-voice-${{ hashFiles('walkthrough/narration.md', 'walkthrough/lexicon.json') }}
          restore-keys: walkthrough-voice-
      - name: Record
        run: pnpm walkthrough ${{ inputs.voice && format('--voice {0}', inputs.voice) || '' }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: concord-walkthrough
          path: |
            walkthrough/out/concord-walkthrough.mp4
            walkthrough/out/concord-walkthrough.vtt
            walkthrough/out/chapters.txt
            walkthrough/out/report.json
          retention-days: 90
      - name: Attach to the release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" walkthrough/out/concord-walkthrough.mp4 walkthrough/out/concord-walkthrough.vtt walkthrough/out/chapters.txt --clobber
        env:
          GH_TOKEN: ${{ github.token }}
