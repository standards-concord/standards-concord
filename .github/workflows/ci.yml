name: CI

# Minutes are metered on a private repo, so CI runs only what a change needs:
#
# - Branches are tested through their pull request, not on every push as well
#   (that used to run everything twice). main is tested on every push.
# - Draft pull requests get the quick checks (typecheck, unit tests, build). The browser
#   tests and the walkthrough check run once the PR is marked ready for review, on every
#   push after that, and on main. Mark a PR ready before you merge it.
# - Changes that only touch docs, Markdown or deploy scripts don't run CI at all.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!deploy/**'
      - '!**/*.md'
      # The walkthrough reads its script and README from Markdown.
      - 'walkthrough/**'
      - '!.github/workflows/e2e-live.yml'
      - '!.github/workflows/mcp-registry.yml'
      - '!.github/workflows/walkthrough.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**'
      - '!docs/**'
      - '!deploy/**'
      - '!**/*.md'
      - 'walkthrough/**'
      - '!.github/workflows/e2e-live.yml'
      - '!.github/workflows/mcp-registry.yml'
      - '!.github/workflows/walkthrough.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels the run it supersedes. main never cancels: a
# run that is building the backend image finishes, and newer main pushes queue behind
# it (GitHub keeps the newest pending one), so the latest main commit always reaches
# the server and an older image never overwrites a newer one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # HermiT (full OWL DL reasoning) runs on Java through owlready2.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # owlready2 (and LinkML for the tests) took most of a minute to install each run.
      - uses: actions/cache@v4
        with:
          path: toolkit/.venv
          key: toolkit-venv-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-linkml-${{ hashFiles('toolkit/requirements.txt', 'toolkit/setup.sh') }}
      - run: ./toolkit/setup.sh --linkml
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Test
        run: pnpm -r test
      - name: Build the web app
        run: pnpm --filter @concord/web build
      - name: Check the public MCP URL is the same in every listing
        run: node scripts/public-url.mjs --check
      - name: Check the plugin files match their schemas
        run: node scripts/validate-listings.mjs
      - name: Check every link to the repo uses the same owner
        run: node scripts/move-repo.mjs --check
      # Building the publisher from source took over a minute; the pinned binary is cached.
      - id: publisher
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/mcp-publisher
          key: mcp-publisher-${{ runner.os }}-v1.8.6
      - if: steps.publisher.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - if: steps.publisher.outputs.cache-hit != 'true'
        name: Build the MCP Registry publisher (pinned, as the publish workflow uses)
        run: |
          GOBIN="$HOME/.local/bin" go install github.com/modelcontextprotocol/registry/cmd/publisher@v1.8.6
          mv "$HOME/.local/bin/publisher" "$HOME/.local/bin/mcp-publisher"
      - name: Check the MCP Registry entry
        run: ~/.local/bin/mcp-publisher validate

  # Browser tests: the alpha walkthrough and every page of the app, against both the
  # Vite dev server (what `pnpm dev` runs) and the production build (what Vercel serves).
  e2e:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [dev, preview]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - name: Build the web app
        if: matrix.mode == 'preview'
        run: pnpm --filter @concord/web build
      - name: Playwright
        run: pnpm test:e2e
        env:
          E2E_MODE: ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.mode }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  # The narrated walkthrough video: every step of its script must still work against
  # this commit's app, so a renamed button fails here rather than in the next recording.
  walkthrough:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
          apt: ffmpeg
      - name: Walkthrough unit tests
        run: pnpm --filter @concord/walkthrough test
      - name: Run every walkthrough step
        run: pnpm walkthrough --check --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walkthrough-check
          path: walkthrough/out/report.json
          retention-days: 7

  # Builds the backend image the server runs. The server pulls a new image every five
  # minutes, so merging to main is the deploy. Only main builds an image (and a manual
  # run, which tags the image with its branch).
  image:
    needs: [test, e2e]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
