<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Terminal</title>
<!--
  A terminal window for the walkthrough's coding-agent scenes. The recorder drives it
  step by step through window.term (see lib/terminal.ts): it types commands, prints a
  Claude Code-style transcript and shows edits as diffs. Tool results shown here come
  from real MCP calls to the Concord server being recorded.
-->
<style>
  :root {
    --bg: #1b1d23; --chrome: #2a2d35; --fg: #e6e6e6; --dim: #8b93a1; --accent: #d97757;
    --green: #8fd18b; --red: #f2888b; --blue: #82aaff; --yellow: #e5c07b; --add-bg: rgba(46,160,67,.22); --del-bg: rgba(248,81,73,.2);
  }
  html, body { margin: 0; height: 100%; background: #0e1116; }
  body { display: flex; align-items: center; justify-content: center; font-family: "JetBrains Mono", "SF Mono", Menlo, "DejaVu Sans Mono", monospace; }
  .window { width: calc(100vw - 64px); height: calc(100vh - 64px); background: var(--bg); border-radius: 12px; box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06); display: flex; flex-direction: column; overflow: hidden; }
  .bar { height: 38px; background: var(--chrome); display: flex; align-items: center; padding: 0 14px; gap: 8px; color: var(--dim); font: 13px Inter, system-ui, sans-serif; }
  .dot { width: 12px; height: 12px; border-radius: 50%; } .r { background: #ff5f57 } .y { background: #febc2e } .g { background: #28c840 }
  .bar .title { flex: 1; text-align: center; margin-right: 52px; }
  .screen { flex: 1; overflow: hidden; padding: 18px 22px 10px; color: var(--fg); font-size: 15.5px; line-height: 1.5; display: flex; flex-direction: column; }
  .scroll { flex: 1; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
  .lines > div { white-space: pre-wrap; word-break: break-word; min-height: 1.5em; }
  .dim { color: var(--dim); } .accent { color: var(--accent); } .green { color: var(--green); } .red { color: var(--red); } .blue { color: var(--blue); } .yellow { color: var(--yellow); } .bold { font-weight: 700; }
  .welcome { border: 1px solid var(--accent); border-radius: 8px; padding: 10px 16px; margin: 4px 0 12px; display: inline-block; align-self: flex-start; }
  .user { color: var(--dim); } .user b { color: var(--fg); font-weight: 400; }
  .bullet { color: var(--fg); } .bullet::before { content: "⏺ "; color: var(--fg); }
  .bullet.tool::before { color: var(--green); }
  .bullet.err::before { color: var(--red); }
  .res { color: var(--dim); padding-left: 2ch; }
  .res::before { content: "⎿  "; }
  .res.cont::before { content: "   "; }
  .diff { margin: 2px 0 6px 5ch; border-radius: 4px; overflow: hidden; }
  .diff div { white-space: pre; padding: 0 8px; }
  .diff .add { background: var(--add-bg); color: #c9f2c7; } .diff .del { background: var(--del-bg); color: #ffd1d1; } .diff .ctx { color: var(--dim); }
  .diff .ln { display: inline-block; width: 4ch; color: var(--dim); text-align: right; margin-right: 1ch; }
  .input { border: 1px solid #444b57; border-radius: 8px; padding: 8px 12px; margin-top: 10px; min-height: 1.5em; white-space: pre-wrap; }
  .input .caret { display: inline-block; width: .6em; height: 1.1em; background: var(--fg); vertical-align: text-bottom; animation: blink 1s steps(1) infinite; }
  .input.hidden { display: none; }
  .hint { color: var(--dim); font-size: 13px; padding: 4px 4px 0; display: flex; justify-content: space-between; }
  @keyframes blink { 50% { opacity: 0 } }
  .spin { color: var(--accent); }
  .shell .prompt { color: var(--green); }
</style>
</head>
<body>
<div class="window">
  <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="title" id="title">helping-hands — zsh</span></div>
  <div class="screen">
    <div class="scroll"><div class="lines" id="lines"></div></div>
    <div class="input hidden" id="input"></div>
    <div class="hint hidden" id="hint"><span>? for shortcuts</span><span id="hintRight"></span></div>
  </div>
</div>
<script>
(() => {
  const lines = document.getElementById('lines');
  const input = document.getElementById('input');
  const hint = document.getElementById('hint');
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
  let mode = 'shell';
  // Seeded jitter so typing looks human but every recording types at the same pace.
  let seed = 7;
  const rand = () => ((seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648);
  let cwd = '~/code/helping-hands';

  function add(html, cls) {
    const d = document.createElement('div');
    if (cls) d.className = cls;
    d.innerHTML = html;
    lines.appendChild(d);
    // Keep the DOM small; the window only shows the bottom anyway.
    while (lines.children.length > 400) lines.firstChild.remove();
    return d;
  }

  async function typeInto(el, text, cps) {
    if (!cps) { el.textContent += text; return; }
    const delay = 1000 / cps;
    for (const ch of text) {
      el.textContent += ch;
      await wait(ch === ' ' ? delay * 0.6 : delay * (0.7 + rand() * 0.6));
    }
  }

  function setCaret(el) {
    const c = document.createElement('span');
    c.className = 'caret';
    el.appendChild(c);
    return c;
  }

  window.term = {
    title(t) { document.getElementById('title').textContent = t; },
    clear() { lines.innerHTML = ''; },
    blank(n = 1) { for (let i = 0; i < n; i++) add(''); },
    print(text, cls) { for (const l of String(text).split('\n')) add(esc(l), cls); },
    html(h, cls) { add(h, cls); },

    /** A shell prompt with a typed command. */
    async shell(cmd, { cps = 32, cwdLabel } = {}) {
      mode = 'shell';
      input.classList.add('hidden'); hint.classList.add('hidden');
      const row = add(`<span class="green">➜</span>  <span class="blue">${esc(cwdLabel || cwd.split('/').pop())}</span> <span class="cmd"></span>`, 'shell');
      const span = row.querySelector('.cmd');
      const caret = setCaret(row);
      await typeInto(span, cmd, cps);
      if (cps) await wait(350);
      caret.remove();
    },

    /** The Claude Code welcome box and input field. */
    startAgent({ version = '', model = '', cwdPath } = {}) {
      mode = 'agent';
      if (cwdPath) cwd = cwdPath;
      add(`<span class="accent">✻</span> Welcome to <span class="bold">Claude Code</span>${version ? ` <span class="dim">${esc(version)}</span>` : ''}\n\n  <span class="dim">/help for help, /status for your current setup</span>\n\n  <span class="dim">cwd: ${esc(cwd)}</span>`, 'welcome');
      input.classList.remove('hidden'); hint.classList.remove('hidden');
      document.getElementById('hintRight').textContent = model;
      input.innerHTML = '<span class="dim">&gt; </span>';
      setCaret(input);
    },

    /** Types a message into the agent's input box and sends it. */
    async ask(text, { cps = 38 } = {}) {
      input.innerHTML = '<span class="dim">&gt; </span><span class="t"></span>';
      const t = input.querySelector('.t');
      const caret = setCaret(input);
      await typeInto(t, text, cps);
      if (cps) await wait(500);
      caret.remove();
      add(`<span class="dim">&gt;</span> <b>${esc(text)}</b>`, 'user');
      add('');
      input.innerHTML = '<span class="dim">&gt; </span>';
      setCaret(input);
    },

    /** "✻ Thinking…" for a moment. */
    async think(ms = 1400, word = 'Thinking') {
      const frames = ['·', '✢', '✳', '✶', '✻', '✽'];
      const row = add('', 'spin');
      const start = performance.now();
      let i = 0;
      while (performance.now() - start < ms) {
        row.textContent = `${frames[i++ % frames.length]} ${word}…`;
        await wait(120);
      }
      row.remove();
    },

    async say(text, { cps = 140 } = {}) {
      const row = add('', 'bullet');
      const span = document.createElement('span');
      row.appendChild(span);
      await typeInto(span, text, cps);
      add('');
    },

    /** A tool call line, e.g. concord - search_terms (MCP)(query: "hours"). */
    tool(label, args) {
      add(`<span class="bold">${esc(label)}</span>${args ? `<span class="dim">(${esc(args)})</span>` : ''}`, 'bullet tool');
    },

    /** Indented result lines under the last tool call, folded after `max` lines. */
    result(text, { max = 8 } = {}) {
      const all = String(text).split('\n');
      const shown = all.slice(0, max);
      shown.forEach((l, i) => add(esc(l), `res${i ? ' cont' : ''}`));
      if (all.length > max) add(`… +${all.length - max} lines <span class="dim">(ctrl+r to expand)</span>`, 'res cont');
      add('');
    },

    /** An edit shown as a unified diff. rows: [{t:'ctx'|'add'|'del', n, s}] */
    diff(file, summary, rows) {
      add(`<span class="bold">Update</span><span class="dim">(${esc(file)})</span>`, 'bullet tool');
      add(esc(summary), 'res');
      const box = add('', 'diff');
      box.className = 'diff';
      for (const r of rows) {
        const d = document.createElement('div');
        d.className = r.t;
        d.innerHTML = `<span class="ln">${r.n ?? ''}</span>${r.t === 'add' ? '+' : r.t === 'del' ? '-' : ' '} ${esc(r.s)}`;
        box.appendChild(d);
      }
      add('');
    },

    get mode() { return mode; },
  };
})();
</script>
</body>
</html>
