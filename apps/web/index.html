<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23005a9c'/%3E%3Ccircle cx='11' cy='16' r='4' fill='white'/%3E%3Ccircle cx='21' cy='16' r='4' fill='white' fill-opacity='.7'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=Public+Sans:wght@400;500;600;700&family=Archivo:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" />
    <script>
      // Apply the chosen look before first paint (see src/lib/look.ts).
      (function () {
        var looks = ['odi', 'spec', 'civic', 'workbench', 'classic'];
        var look = 'odi';
        try {
          var stored = localStorage.getItem('concord-look');
          // A preview build briefly saved choices under concord-look-2 (see src/lib/look.ts).
          if (looks.indexOf(stored) < 0) stored = localStorage.getItem('concord-look-2');
          if (looks.indexOf(stored) >= 0) look = stored;
        } catch (e) {}
        var param = new URLSearchParams(location.search).get('look');
        if (looks.indexOf(param) >= 0) look = param;
        document.documentElement.dataset.look = look;
      })();
    </script>
    <title>Concord</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
