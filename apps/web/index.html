<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23005a9c'/%3E%3Cg fill='white' transform='rotate(45 32 32) translate(32 32) scale(.96) translate(-32 -32)'%3E%3Cpath d='M31 5.5C30.3 8.5 29.7 12 29.6 16L29.4 21C28.8 31 25.5 38 18 45C14 48.6 10.6 50.5 8 52.6L8 55.2L29 55.6L29.8 59L31 60.2Z'/%3E%3Cpath fill-opacity='.62' d='M33 5.5C33.7 8.5 34.3 12 34.4 16L34.6 21C35.2 31 38.5 38 46 45C50 48.6 53.4 50.5 56 52.6L56 55.2L35 55.6L34.2 59L33 60.2Z'/%3E%3C/g%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=Public+Sans:wght@400;500;600;700&family=Archivo:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" />
    <script>
      // Apply the chosen look before first paint (see src/lib/look.ts).
      (function () {
        var looks = ['odi', 'spec', 'civic', 'workbench', 'classic'];
        var look = 'odi';
        try {
          // Choices saved under concord-look predate the ODI look and are ignored (see src/lib/look.ts);
          // a preview build briefly saved choices under concord-look-2.
          var stored = localStorage.getItem('concord-style');
          if (looks.indexOf(stored) < 0) stored = localStorage.getItem('concord-look-2');
          if (looks.indexOf(stored) >= 0) look = stored;
        } catch (e) {}
        var param = new URLSearchParams(location.search).get('look');
        if (looks.indexOf(param) >= 0) look = param;
        document.documentElement.dataset.look = look;
      })();
    </script>
    <title>Concord</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
